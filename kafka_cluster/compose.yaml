services:
  kafka-0:
    image: bitnami/kafka:3.4
    ports:
      - "9094:9094"
    env_file:
      - .env.kafka
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka-0:9092,EXTERNAL://kafka-0:9094
    volumes:
      - kafka_0_data:/bitnami/kafka


  kafka-1:
    image: bitnami/kafka:3.4
    ports:
      - "9095:9095"
    env_file:
      - .env.kafka
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9095
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka-1:9092,EXTERNAL://kafka-1:9095
    volumes:
      - kafka_1_data:/bitnami/kafka

  kafka-2:
    image: bitnami/kafka:3.4
    ports:
      - "9096:9096"
    env_file:
      - .env.kafka
    environment:
      - KAFKA_CFG_NODE_ID=2
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9096
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka-2:9092,EXTERNAL://kafka-2:9096
    volumes:
      - kafka_2_data:/bitnami/kafka

  kafka-topics-init:
    image: bitnami/kafka:3.4
    depends_on:
      - kafka-0
      - kafka-1
      - kafka-2
    volumes:
      - ./prepare_kafka.sh:/usr/local/bin/prepare_kafka.sh
    entrypoint: [ "/bin/bash", "/usr/local/bin/prepare_kafka.sh" ]

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.0
    profiles:
      - debug
    ports:
      - "8080:8080"
    env_file:
      - .env.kafka

volumes:
  kafka_0_data:
  kafka_1_data:
  kafka_2_data: