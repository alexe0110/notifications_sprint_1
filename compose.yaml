include:
  - notifications_api/compose.yaml
  - automatic_event_generator/compose.yaml
  - kafka_cluster/compose.yaml
  - admin_panel/compose.yaml
  - notification_worker/compose.yaml


services:
  postgres:
    image: postgres:16.1
    restart: always
    env_file: .env
    ports:
      - "5432:5432"
    environment:
      LANG: C.UTF-8
    volumes:
      - pg_data:/var/lib/postgresql/data

#  redis:
#    image: redis:7.2.5
#    restart: always
#    env_file: .env
#    # ...
#

  nginx:
    image: nginx:1.25.5
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/data/static
    depends_on:
      - notifications_api
      - admin_panel
      - notification_worker

volumes:
  pg_data:
    driver: local
